<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
 <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #FFEE8C;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #B3EBF2;
            color: black;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            color: black;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #334155;
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 50px;
        }

        .resume-container {
            max-width: 1200px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            min-height: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
     h2 {
         text-align:center;
         margin-bottom: 15px;
     }
     h3 {
         text-align:center;
         margin-bottom: 15px;
     }

        .intro {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
           <h2>Alyssa Turner</h2>
        <h3>Portfolio</h3>

        <ul>
            <li><a href="index.html">About Me</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="resume-container">
            <h1>Resume</h1>
         <img src="profile.jpg" alt="Resume" class="profile-photo" width="1000">
        </div>
    </main>
</body>
</html>
