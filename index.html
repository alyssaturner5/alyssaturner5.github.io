<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | About Me</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #B3EBF2;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #FFEE8C;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #334155;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 50px;
        }

        .profile-photo {
            width: 520px;
            height: 520px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 30px auto;
            border: 4px solid #FFEE8C;
        }

        .about-list {
            margin-top: 20px;
            padding-left: 25px;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .intro {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <h2>My Portfolio</h2>

        <ul>
            <li><a href="index.html">About Me</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="about-container">
            <h1>About Me</h1>

            <!-- Replace profile.jpg with your image -->
            <img src="profile.jpg" alt="Profile Photo" class="profile-photo">

            <p class="intro">
                Hi! I'm <strong>Your Name</strong>. Welcome to my personal portfolio website.
            </p>

            <ul class="about-list">
                <li>Graduate from University of Pittsburgh H2P</li>
                <li>IDK</li>
                <li>IDK</li>
                <li>Love to run (I just ran my first marathon on my graduation day!)</li>
                <li>Pens</li>
                <li>IDK</li>
            </ul>
        </div>
    </main>

</body>
</html>
